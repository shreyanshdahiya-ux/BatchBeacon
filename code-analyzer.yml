# Salesforce Code Analyzer (v5) configuration for Batch Beacon.
#
# Rule overrides below document reviewed findings that are intentional or false
# positives. Inline Apex suppressions handle the case-by-case CRUD/FLS findings
# (see @SuppressWarnings / sfge-disable-stack directives in the Apex classes).
rules:
  pmd:
    ProtectSensitiveData:
      # Reviewed FALSE POSITIVE.
      # Summary_Key__c on Daily_Job_Summary__c is a composite grouping key
      # (pattern: ClassName__YYYY-MM-DD) used as the upsert External ID. It is not
      # a credential, secret or auth token. Re-tagged so it is excluded from the
      # default (Recommended) rule selection.
      tags: ["ReviewedFalsePositive"]
