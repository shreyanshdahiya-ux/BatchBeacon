<template>
    <lightning-card icon-name="utility:chart">
        <span slot="title" class="slds-grid slds-grid_vertical-align-center">
            <span class="slds-m-right_x-small">Daily Batch Job Trend</span>
            <lightning-helptext content="Daily batch-job volume over the selected window, stacked by Completed, In Progress and Failed/Aborted. Pick the window length and the end date; hover a bar for the per-status breakdown and total."></lightning-helptext>
        </span>
        <div slot="actions" class="slds-grid slds-gutters_xx-small slds-grid_vertical-align-center">
            <div class="slds-col">
                <lightning-input
                    type="date"
                    label="End date"
                    variant="label-hidden"
                    value={endDate}
                    onchange={handleDateChange}
                ></lightning-input>
            </div>
            <div class="slds-col">
                <lightning-combobox
                    name="lookback"
                    label="Lookback"
                    variant="label-hidden"
                    value={lookbackStr}
                    options={lookbackOptions}
                    onchange={handleLookbackChange}
                ></lightning-combobox>
            </div>
        </div>

        <!-- Stat tiles -->
        <div class="stat-tiles slds-p-horizontal_small slds-p-bottom_x-small">
            <div class="stat-tile">
                <div class="stat-num">{totalJobs}</div>
                <div class="stat-cap">Total</div>
            </div>
            <div class="stat-tile">
                <div class="stat-num">{avgPerDay}</div>
                <div class="stat-cap">Avg / day</div>
            </div>
            <div class="stat-tile">
                <div class="stat-num">{peakCount}</div>
                <div class="stat-cap">Peak · {peakDayLabel}</div>
            </div>
        </div>

        <div class="slds-p-horizontal_small slds-p-bottom_small">
            <template lwc:if={loading}>
                <div class="slds-is-relative chart-state">
                    <lightning-spinner alternative-text="Loading chart" size="small"></lightning-spinner>
                </div>
            </template>

            <template lwc:if={error}>
                <div class="slds-text-color_error slds-p-around_small slds-text-align_center">
                    <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                    Unable to load chart data.
                </div>
            </template>

            <template lwc:if={showEmpty}>
                <div class="chart-state slds-text-align_center slds-text-color_weak">
                    <lightning-icon icon-name="utility:chart" size="small" class="slds-m-bottom_x-small"></lightning-icon>
                    <p>No batch jobs in this window.</p>
                </div>
            </template>

            <div class={chartWrapperClass}>
                <canvas class="trend" lwc:dom="manual"></canvas>
            </div>
        </div>
    </lightning-card>
</template>
