<template>
    <div class="tile">
        <!-- Header -->
        <div class="tile-head">
            <div class="head-icon">
                <lightning-icon icon-name="utility:metrics" variant="inverse" size="small"></lightning-icon>
            </div>
            <div class="head-text">
                <div class="head-title">Batch Jobs Dashboard</div>
                <div class="head-sub">Salesforce Lightning Platform</div>
            </div>
            <span class="head-badge">LAST 24 HRS</span>
        </div>

        <template lwc:if={loading}>
            <div class="slds-is-relative slds-p-vertical_x-large">
                <lightning-spinner alternative-text="Loading" size="small"></lightning-spinner>
            </div>
        </template>

        <template lwc:elseif={error}>
            <div class="slds-text-color_error slds-p-around_medium slds-text-align_center">
                <lightning-icon icon-name="utility:error" variant="error" size="x-small"></lightning-icon>
                Unable to load summary.
            </div>
        </template>

        <template lwc:else>
            <!-- Body: total + gauge -->
            <div class="tile-body">
                <div class="total-block">
                    <div class="total-label">Total Executions</div>
                    <div class="total-num">{total}</div>
                    <div class="total-cap">Executions · 24h</div>
                    <div class="total-bar">
                        <div class="total-fill" style={progressBarStyle}></div>
                    </div>
                    <div class="total-frac">{progressFraction}</div>
                </div>

                <div class="gauge-block">
                    <div class="gauge-wrap">
                        <svg viewBox="0 0 120 120" class="gauge">
                            <circle cx="60" cy="60" r="52" class="gauge-track"></circle>
                            <circle cx="60" cy="60" r="52" class="gauge-fill" style={ringStyle}></circle>
                        </svg>
                        <div class="gauge-center">
                            <div class="gauge-top">Success rate</div>
                            <div class="gauge-pct" style={rateTextStyle}>{successRateLabel}</div>
                            <div class="gauge-bottom">job success</div>
                        </div>
                    </div>
                    <div class="gauge-target">Target: &gt;85%</div>
                </div>
            </div>

            <!-- Status cards -->
            <div class="stat-cards">
                <div class="stat-card sc-green">
                    <div class="sc-head">
                        <lightning-icon icon-name="utility:success" variant="success" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                        Completed
                    </div>
                    <div class="sc-num num-green">{successCount}</div>
                    <div class="sc-cap">Successfully finalized</div>
                </div>
                <div class="stat-card sc-red">
                    <div class="sc-head">
                        <lightning-icon icon-name="utility:ban" variant="error" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                        Failed
                    </div>
                    <div class="sc-num num-red">{failureCount}</div>
                    <div class="sc-cap">Failed / aborted · action required</div>
                </div>
                <div class="stat-card sc-amber">
                    <div class="sc-head">
                        <lightning-icon icon-name="utility:spinner" size="x-small" class="slds-m-right_xx-small"></lightning-icon>
                        In Progress
                    </div>
                    <div class="sc-num num-amber">{inProgressCount}</div>
                    <div class="sc-cap">Currently processing</div>
                </div>
            </div>
        </template>

        <!-- Footer -->
        <div class="tile-foot">
            <lightning-icon icon-name="utility:clock" size="xx-small" class="slds-m-right_xx-small"></lightning-icon>
            Last refresh: {lastRefresh}
        </div>
    </div>
</template>
